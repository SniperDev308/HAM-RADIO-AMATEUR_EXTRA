<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amateur Extra - Estudio FCC Elemento 4 (2024-2028)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Exo+2:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#050a0f;--bg2:#091520;--bg3:#0f1e2d;--card:#0c1a27;--accent:#00c8f0;--accent2:#ff6b00;--gold:#ffd040;--text:#ddeeff;--text2:#6a9ab5;--border:#173248;--correct:#00e87a;--wrong:#ff4455;--shadow:0 4px 24px rgba(0,0,0,.5)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Exo 2',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,200,240,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,200,240,.025) 1px,transparent 1px);background-size:44px 44px;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:14px 14px 40px}
header{text-align:center;padding:24px 0 18px}
header::after{content:'';display:block;height:2px;margin-top:18px;background:linear-gradient(90deg,transparent,var(--accent),var(--accent2),var(--accent),transparent)}
.badge{display:inline-flex;align-items:center;background:linear-gradient(135deg,#ffd040,#ff8c00);color:#000;font-family:'Orbitron',monospace;font-size:9px;font-weight:900;padding:4px 14px;border-radius:20px;letter-spacing:2px;margin-bottom:10px}
h1{font-family:'Orbitron',monospace;font-size:clamp(18px,5vw,32px);font-weight:900;color:var(--accent);text-shadow:0 0 24px rgba(0,200,240,.45);letter-spacing:2px;line-height:1.2}
h1 span{color:var(--gold)}.sub{font-family:'Share Tech Mono',monospace;color:var(--text2);font-size:11px;margin-top:5px;letter-spacing:1px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.sc{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 6px;text-align:center;position:relative;overflow:hidden}
.sc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--accent)}
.sc.g::before{background:var(--correct)}.sc.r::before{background:var(--wrong)}.sc.y::before{background:var(--gold)}
.sv{font-family:'Orbitron',monospace;font-size:20px;font-weight:700;color:var(--accent);line-height:1}
.sc.g .sv{color:var(--correct)}.sc.r .sv{color:var(--wrong)}.sc.y .sv{color:var(--gold)}
.sl{font-size:9px;color:var(--text2);margin-top:3px;letter-spacing:.5px}
.prog-wrap{height:7px;background:var(--bg3);border-radius:4px;margin:10px 0;overflow:hidden;border:1px solid var(--border)}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:4px;transition:width .4s ease}
.modes{display:flex;gap:8px;margin:14px 0}
.mbtn{flex:1;padding:10px 6px;border:1px solid var(--border);background:var(--bg2);color:var(--text2);border-radius:10px;cursor:pointer;font-family:'Exo 2',sans-serif;font-size:11px;font-weight:600;transition:all .2s;text-align:center}
.mbtn.on{border-color:var(--accent);background:rgba(0,200,240,.1);color:var(--accent);box-shadow:0 0 14px rgba(0,200,240,.25)}
.mbtn:hover:not(.on){border-color:var(--text2);color:var(--text)}.mi{font-size:15px;display:block;margin-bottom:2px}
.filt{margin:10px 0}.flbl{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--text2);letter-spacing:1px;margin-bottom:7px;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{padding:4px 10px;border-radius:20px;border:1px solid var(--border);background:var(--bg2);color:var(--text2);font-size:10px;font-family:'Share Tech Mono',monospace;cursor:pointer;transition:all .2s;white-space:nowrap}
.chip.on{border-color:var(--accent2);background:rgba(255,107,0,.12);color:var(--accent2)}.chip:hover:not(.on){border-color:var(--text2);color:var(--text)}
.qhdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.qid{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--accent2);background:rgba(255,107,0,.09);border:1px solid rgba(255,107,0,.25);padding:3px 8px;border-radius:4px;letter-spacing:1px}
.qnum{font-family:'Orbitron',monospace;font-size:10px;color:var(--text2)}
.qcard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:12px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.qcard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.qtxt{font-size:14px;line-height:1.65;color:var(--text)}
.agrid{display:flex;flex-direction:column;gap:7px}
.abtn{display:flex;align-items:flex-start;gap:11px;padding:11px 13px;border:1px solid var(--border);background:var(--bg2);border-radius:10px;cursor:pointer;text-align:left;transition:all .2s;width:100%;font-family:'Exo 2',sans-serif;font-size:13px;color:var(--text);line-height:1.4}
.abtn:hover:not(:disabled){border-color:var(--accent);background:rgba(0,200,240,.06);transform:translateX(3px)}
.abtn:disabled{cursor:default}.abtn.correct{border-color:var(--correct);background:rgba(0,232,122,.09);color:var(--correct)}
.abtn.wrong{border-color:var(--wrong);background:rgba(255,68,85,.09);color:var(--wrong)}.abtn.reveal{border-color:var(--correct);background:rgba(0,232,122,.04);color:var(--correct);opacity:.65}
.altr{font-family:'Orbitron',monospace;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid currentColor;flex-shrink:0;margin-top:2px}
.fb{padding:11px 14px;border-radius:10px;margin:10px 0;font-size:13px;font-weight:600;display:none;align-items:center;gap:9px}
.fb.show{display:flex}.fb.ok{background:rgba(0,232,122,.09);border:1px solid var(--correct);color:var(--correct)}.fb.err{background:rgba(255,68,85,.09);border:1px solid var(--wrong);color:var(--wrong)}
.fbi{font-size:18px;flex-shrink:0}
.brow{display:flex;gap:7px;margin:12px 0}
.btn{flex:1;padding:11px;border-radius:10px;border:1px solid var(--border);cursor:pointer;font-family:'Exo 2',sans-serif;font-size:12px;font-weight:700;letter-spacing:.5px;transition:all .2s}
.btn-p{background:linear-gradient(135deg,var(--accent),#0088bb);border-color:var(--accent);color:#000;box-shadow:0 0 12px rgba(0,200,240,.25)}
.btn-p:hover{box-shadow:0 0 22px rgba(0,200,240,.5);transform:translateY(-1px)}
.btn-s{background:var(--bg2);color:var(--text2)}.btn-s:hover{border-color:var(--text2);color:var(--text)}
.btn-w{background:rgba(255,107,0,.12);border-color:var(--accent2);color:var(--accent2)}.btn-w:hover{background:rgba(255,107,0,.22)}
.fcwrap{perspective:1000px;margin:14px 0;min-height:190px}
.fc{position:relative;width:100%;min-height:190px;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,0,.2,1);cursor:pointer}.fc.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:var(--shadow)}
.front::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:14px 14px 0 0}
.back{transform:rotateY(180deg);background:linear-gradient(135deg,#081a0f,#0b2016);border-color:rgba(0,232,122,.25)}
.back::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--correct),#00bb55);border-radius:14px 14px 0 0}
.fhint{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--text2);position:absolute;bottom:11px;opacity:.55;letter-spacing:1px}
.fq{font-size:14px;line-height:1.6;color:var(--text)}.fa{font-size:15px;font-weight:600;color:var(--correct);line-height:1.5}
.fltr{font-family:'Orbitron',monospace;font-size:32px;font-weight:900;color:var(--correct);opacity:.18;position:absolute;top:10px;right:16px}
.result{display:none;text-align:center;padding:28px 16px}.result.show{display:block}
.rscore{font-family:'Orbitron',monospace;font-size:56px;font-weight:900;line-height:1;margin:8px 0}
.rscore.pass{color:var(--correct);text-shadow:0 0 28px rgba(0,232,122,.45)}.rscore.fail{color:var(--wrong);text-shadow:0 0 28px rgba(255,68,85,.45)}
.rlbl{font-size:12px;color:var(--text2);margin-bottom:4px}.rverdict{font-family:'Orbitron',monospace;font-size:14px;font-weight:700;margin:8px 0 18px;letter-spacing:2px}
.rverdict.pass{color:var(--correct)}.rverdict.fail{color:var(--wrong)}
.bkd{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:13px;margin:12px 0;text-align:left}
.bkd-t{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--text2);letter-spacing:1px;margin-bottom:9px;text-transform:uppercase}
.bkd-row{display:flex;align-items:center;gap:7px;margin:5px 0;font-size:11px}
.bkd-se{font-family:'Share Tech Mono',monospace;color:var(--accent2);min-width:26px;font-size:10px}
.bkd-bw{flex:1;height:5px;background:var(--bg3);border-radius:3px;overflow:hidden}
.bkd-b{height:100%;border-radius:3px;transition:width .5s ease}.bkd-p{font-size:10px;color:var(--text2);min-width:30px;text-align:right}
.aibox{background:linear-gradient(135deg,rgba(0,200,240,.04),rgba(0,136,187,.04));border:1px solid rgba(0,200,240,.18);border-radius:10px;padding:13px;margin:9px 0;display:none}
.aibox.show{display:block}.aihdr{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--accent);letter-spacing:1px;margin-bottom:7px;text-transform:uppercase}
.aitxt{font-size:12px;line-height:1.65;color:var(--text2)}.dots{display:flex;gap:4px;align-items:center}
.dot{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:blink 1s infinite}.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}.hidden{display:none!important}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
@media(max-width:480px){.stats{grid-template-columns:repeat(2,1fr)}.modes{flex-wrap:wrap}.mbtn{flex:1 1 calc(33% - 6px);min-width:75px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="badge">AMATEUR EXTRA</div>
  <h1>ELEMENTO <span>4</span> - FCC</h1>
  <div class="sub">BANCO OFICIAL 2024-2028 | 552 PREGUNTAS | EN ESPANOL</div>
</header>
<div class="stats">
  <div class="sc"><div class="sv" id="sT">0</div><div class="sl">Respondidas</div></div>
  <div class="sc g"><div class="sv" id="sC">0</div><div class="sl">Correctas</div></div>
  <div class="sc r"><div class="sv" id="sW">0</div><div class="sl">Incorrectas</div></div>
  <div class="sc y"><div class="sv" id="sP">-</div><div class="sl">% Acierto</div></div>
</div>
<div class="prog-wrap"><div class="prog-fill" id="pf" style="width:0%"></div></div>
<div class="modes">
  <button class="mbtn on" id="mR" onclick="setMode('r')"><span class="mi">&#128214;</span>Repasar</button>
  <button class="mbtn" id="mF" onclick="setMode('f')"><span class="mi">&#9889;</span>Flashcards</button>
  <button class="mbtn" id="mQ" onclick="setMode('q')"><span class="mi">&#127919;</span>Examen</button>
</div>
<div class="filt" id="filtSec">
  <div class="flbl">Filtrar subelemento</div>
  <div class="chips" id="chipGrid"></div>
</div>
<div id="studyArea">
  <div class="fcwrap hidden" id="fcWrap">
    <div class="fc" id="fcCard" onclick="flipCard()">
      <div class="face front"><div class="fltr" id="fcLtr"></div><div class="fq" id="fcQ"></div><div class="fhint">TAP PARA VER RESPUESTA</div></div>
      <div class="face back"><div class="fa" id="fcA"></div><div class="fhint">TAP PARA SIGUIENTE</div></div>
    </div>
  </div>
  <div id="repArea">
    <div class="qhdr"><span class="qid" id="qId">-</span><span class="qnum" id="qNum">-</span></div>
    <div class="qcard"><div class="qtxt" id="qTxt"></div></div>
    <div class="agrid" id="aGrid"></div>
    <div class="fb" id="fb"><span class="fbi" id="fbi"></span><span id="fbt"></span></div>
    <div class="aibox" id="aiBox"><div class="aihdr">INSTRUCTOR IA - CLASE EXTRA</div><div class="aitxt" id="aiTxt"></div></div>
  </div>
  <div class="brow" id="studyBtns">
    <button class="btn btn-s" onclick="prev()">Anterior</button>
    <button class="btn btn-w" onclick="explain()">Explicar</button>
    <button class="btn btn-p" onclick="next()">Siguiente</button>
  </div>
</div>
<div id="quizArea" class="hidden">
  <div class="qhdr"><span class="qid" id="qqId"></span><span class="qnum" id="qqNum"></span></div>
  <div class="qcard"><div class="qtxt" id="qqTxt"></div></div>
  <div class="agrid" id="qqGrid"></div>
  <div class="fb" id="qqFb"><span class="fbi" id="qqFbi"></span><span id="qqFbt"></span></div>
  <div class="brow" id="qqBtn" style="display:none"><button class="btn btn-p" onclick="nextQQ()">Siguiente</button></div>
  <div class="result" id="qResult">
    <div class="rlbl">Resultado del Simulacro de Examen</div>
    <div class="rscore" id="rScore"></div>
    <div style="color:var(--text2);font-size:12px;margin-bottom:4px" id="rFrac"></div>
    <div class="rverdict" id="rVerdict"></div>
    <div style="color:var(--text2);font-size:11px;margin-bottom:14px">Aprobatorio: 74% (37/50)</div>
    <div class="bkd" id="bkdSec"></div>
    <div class="brow">
      <button class="btn btn-s" onclick="setMode('q')">Nuevo Examen</button>
      <button class="btn btn-p" onclick="setMode('r')">Repasar</button>
    </div>
  </div>
</div>
</div>

var SE={E1:{n:"Reglas",e:6},E2:{n:"Procedimientos",e:5},E3:{n:"Propagacion",e:3},E4:{n:"Practica",e:5},E5:{n:"Principios Electricos",e:4},E6:{n:"Componentes",e:6},E7:{n:"Circuitos",e:8},E8:{n:"Senales",e:4},E9:{n:"Antenas",e:8},E0:{n:"Seguridad",e:1}};
var API="https://ham-radio-extra-api.franklinsandovalit.workers.dev";
var mode="r",pool=Q.slice(),idx=0,answered=false,flipped=false;
var st={t:0,c:0,w:0},seF="ALL",qPool=[],qIdx=0,qSc={t:0,c:0,by:{}};
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function init(){buildChips();loadSt();shuffle(pool);renderQ();}
function buildChips(){
  var g=document.getElementById("chipGrid");
  var html='<span class="chip on" onclick="filterSE(this,\'ALL\')">Todos (552)</span>';
  var keys=Object.keys(SE);
  for(var i=0;i<keys.length;i++){
    var se=keys[i];var cnt=0;
    for(var j=0;j<Q.length;j++){if(Q[j].subelement===se)cnt++;}
    html+='<span class="chip" onclick="filterSE(this,\''+se+'\')">'+se+' - '+SE[se].n+' ('+cnt+')</span>';
  }
  g.innerHTML=html;
}
function filterSE(el,se){
  var chips=document.querySelectorAll(".chip");
  for(var i=0;i<chips.length;i++)chips[i].classList.remove("on");
  el.classList.add("on");seF=se;pool=[];
  for(var i=0;i<Q.length;i++){if(se==="ALL"||Q[i].subelement===se)pool.push(Q[i]);}
  shuffle(pool);idx=0;answered=false;resetAI();renderQ();
  if(mode==="f")renderFC();
}
function setMode(m){
  mode=m;
  document.getElementById("mR").classList.remove("on");
  document.getElementById("mF").classList.remove("on");
  document.getElementById("mQ").classList.remove("on");
  document.getElementById(m==="r"?"mR":m==="f"?"mF":"mQ").classList.add("on");
  document.getElementById("filtSec").classList.toggle("hidden",m==="q");
  document.getElementById("studyArea").classList.toggle("hidden",m==="q");
  document.getElementById("quizArea").classList.toggle("hidden",m!=="q");
  document.getElementById("fcWrap").classList.toggle("hidden",m!=="f");
  document.getElementById("repArea").classList.toggle("hidden",m==="f");
  document.getElementById("studyBtns").classList.toggle("hidden",m==="q");
  resetAI();answered=false;flipped=false;
  if(m==="q")startQuiz();
  else if(m==="f"){renderQ();renderFC();}
  else renderQ();
}
function renderQ(){
  if(!pool.length)return;
  var q=pool[idx];
  document.getElementById("qId").textContent=q.id;
  document.getElementById("qNum").textContent=(idx+1)+" / "+pool.length;
  document.getElementById("qTxt").textContent=q.question;
  var g=document.getElementById("aGrid");g.innerHTML="";
  var letters=["A","B","C","D"];
  for(var i=0;i<letters.length;i++){
    var l=letters[i];if(!q.answers[l])continue;
    var b=document.createElement("button");b.className="abtn";b.setAttribute("data-l",l);
    var s1=document.createElement("span");s1.className="altr";s1.textContent=l;
    var s2=document.createElement("span");s2.textContent=q.answers[l];
    b.appendChild(s1);b.appendChild(s2);
    (function(letter,cor,btn,ct){btn.onclick=function(){pick(letter,cor,btn,ct);};})(l,q.correct,b,q.answers[q.correct]);
    g.appendChild(b);
  }
  hideFb();resetAI();answered=false;updateProg();
}
function pick(ch,cor,btn,ct){
  if(answered)return;answered=true;
  var btns=document.querySelectorAll("#aGrid .abtn");
  for(var i=0;i<btns.length;i++){btns[i].disabled=true;if(btns[i].getAttribute("data-l")===cor)btns[i].classList.add("reveal");}
  if(ch===cor){btn.classList.remove("reveal");btn.classList.add("correct");showFb(true,"Correcto! "+ct);st.c++;}
  else{btn.classList.add("wrong");showFb(false,"Incorrecto. Correcta "+cor+": "+ct);st.w++;}
  st.t++;saveSt();updateSt();
}
function showFb(ok,msg){var f=document.getElementById("fb");f.className="fb show "+(ok?"ok":"err");document.getElementById("fbi").textContent=ok?"✅":"❌";document.getElementById("fbt").textContent=msg;}
function hideFb(){document.getElementById("fb").className="fb";}
function prev(){idx=(idx-1+pool.length)%pool.length;answered=false;renderQ();if(mode==="f")renderFC();}
function next(){idx=(idx+1)%pool.length;answered=false;renderQ();if(mode==="f"){flipped=false;renderFC();}}
function renderFC(){
  if(!pool.length)return;
  var q=pool[idx];
  document.getElementById("fcQ").textContent=q.question;
  document.getElementById("fcA").textContent=q.answers[q.correct];
  document.getElementById("fcLtr").textContent=q.correct;
  document.getElementById("fcCard").classList.remove("flip");flipped=false;
}
function flipCard(){var c=document.getElementById("fcCard");if(!flipped){c.classList.add("flip");flipped=true;}else{next();}}
function startQuiz(){
  qPool=[];qIdx=0;qSc={t:0,c:0,by:{}};
  var keys=Object.keys(SE);
  for(var i=0;i<keys.length;i++){
    var se=keys[i];var p=[];
    for(var j=0;j<Q.length;j++){if(Q[j].subelement===se)p.push(Q[j]);}
    shuffle(p);for(var k=0;k<SE[se].e&&k<p.length;k++)qPool.push(p[k]);
  }
  shuffle(qPool);
  document.getElementById("qResult").classList.remove("show");
  document.getElementById("qqBtn").style.display="none";
  renderQQ();
}
function renderQQ(){
  if(qIdx>=qPool.length){showResult();return;}
  var q=qPool[qIdx];
  document.getElementById("qqId").textContent=q.id;
  document.getElementById("qqNum").textContent=(qIdx+1)+" / "+qPool.length;
  document.getElementById("qqTxt").textContent=q.question;
  var g=document.getElementById("qqGrid");g.innerHTML="";
  var letters=["A","B","C","D"];
  for(var i=0;i<letters.length;i++){
    var l=letters[i];if(!q.answers[l])continue;
    var b=document.createElement("button");b.className="abtn";b.setAttribute("data-l",l);
    var s1=document.createElement("span");s1.className="altr";s1.textContent=l;
    var s2=document.createElement("span");s2.textContent=q.answers[l];
    b.appendChild(s1);b.appendChild(s2);
    (function(letter,cor,btn,se2,ct){btn.onclick=function(){pickQQ(letter,cor,btn,se2,ct);};})(l,q.correct,b,q.subelement,q.answers[q.correct]);
    g.appendChild(b);
  }
  document.getElementById("qqFb").className="fb";
  document.getElementById("qqBtn").style.display="none";
}
function pickQQ(ch,cor,btn,se,ct){
  var btns=document.querySelectorAll("#qqGrid .abtn");
  for(var i=0;i<btns.length;i++){btns[i].disabled=true;if(btns[i].getAttribute("data-l")===cor)btns[i].classList.add("reveal");}
  var ok=ch===cor;
  if(ok){btn.classList.remove("reveal");btn.classList.add("correct");}else btn.classList.add("wrong");
  var f=document.getElementById("qqFb");f.className="fb show "+(ok?"ok":"err");
  document.getElementById("qqFbi").textContent=ok?"✅":"❌";
  document.getElementById("qqFbt").textContent=ok?"Correcto!":"Incorrecta. "+cor+": "+ct;
  qSc.t++;if(ok)qSc.c++;
  if(!qSc.by[se])qSc.by[se]={c:0,t:0};
  qSc.by[se].t++;if(ok)qSc.by[se].c++;
  document.getElementById("qqBtn").style.display="flex";
}
function nextQQ(){qIdx++;renderQQ();}
function showResult(){
  var pct=Math.round((qSc.c/qSc.t)*100);var pass=pct>=74;
  document.getElementById("qResult").classList.add("show");
  document.getElementById("qqGrid").innerHTML="";
  document.getElementById("qqId").textContent="";document.getElementById("qqNum").textContent="";
  document.getElementById("qqTxt").textContent="";document.getElementById("qqFb").className="fb";
  document.getElementById("qqBtn").style.display="none";
  var sc=document.getElementById("rScore");sc.textContent=pct+"%";sc.className="rscore "+(pass?"pass":"fail");
  document.getElementById("rFrac").textContent=qSc.c+" / "+qSc.t+" correctas";
  var v=document.getElementById("rVerdict");v.textContent=pass?"APROBADO":"REPROBADO";v.className="rverdict "+(pass?"pass":"fail");
  var html='<div class="bkd-t">Desglose por subelemento</div>';
  var keys=Object.keys(qSc.by);
  for(var i=0;i<keys.length;i++){
    var se=keys[i];var sc2=qSc.by[se];var p=Math.round((sc2.c/sc2.t)*100);
    var col=p>=74?"var(--correct)":"var(--wrong)";
    html+='<div class="bkd-row"><span class="bkd-se">'+se+'</span><div class="bkd-bw"><div class="bkd-b" style="width:'+p+'%;background:'+col+'"></div></div><span class="bkd-p">'+sc2.c+'/'+sc2.t+'</span></div>';
  }
  document.getElementById("bkdSec").innerHTML=html;
  st.t+=qSc.t;st.c+=qSc.c;st.w+=(qSc.t-qSc.c);saveSt();updateSt();
}
async function explain(){
  if(!answered){alert("Responde la pregunta primero.");return;}
  var q=pool[idx];
  var box=document.getElementById("aiBox");var txt=document.getElementById("aiTxt");
  box.classList.add("show");
  txt.innerHTML='<div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
  try{
    var res=await fetch(API+"/explain",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:q.question,answers:q.answers,correct:q.correct})});
    var data=await res.json();
    txt.textContent=data.explanation||"Explicacion no disponible.";
  }catch(e){
    txt.textContent="Respuesta correcta: "+q.correct+": "+q.answers[q.correct];
  }
}
function resetAI(){document.getElementById("aiBox").classList.remove("show");}
function updateSt(){document.getElementById("sT").textContent=st.t;document.getElementById("sC").textContent=st.c;document.getElementById("sW").textContent=st.w;document.getElementById("sP").textContent=st.t>0?Math.round((st.c/st.t)*100)+"%":"-";}
function updateProg(){document.getElementById("pf").style.width=pool.length>0?((idx+1)/pool.length*100)+"%":"0%";}
function saveSt(){try{localStorage.setItem("extra24_st",JSON.stringify(st));}catch(e){}}
function loadSt(){try{var s=localStorage.getItem("extra24_st");if(s){st=JSON.parse(s);updateSt();}}catch(e){}}
init();
})();
